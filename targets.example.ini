# Copy to targets.ini, fill in, and run:  chmod 600 targets.ini
# Use it with:  python t1ote_export_assets.py sbom --config targets.ini
#               python t1ote_export_assets.py assets --config targets.ini
#
# Each [section] is one Tenable OT target. The section name labels that target's
# data in reports (the `site` column) when it is a standalone ICP.
# Comments must be on their own lines: a comment after a value becomes part of it.

# Optional: settings applied to every section below unless it overrides them.
[DEFAULT]
# tls_verify = 0
# ca_bundle = corp-ca.pem

# A standalone ICP (no Enterprise Manager).
# api_key_env reads the key from an environment variable, keeping it out of this file.
[london]
url = https://london.example.com
api_key_env = LONDON_API_KEY

# The key can also be written here; then keep this file chmod 600 and out of git.
[sydney]
url = https://sydney.example.com
api_key = paste-the-key-here

# An Enterprise Manager. `site` is the site NAME (never an id). Omit it to use the
# only paired site, or write `all` for every paired site.
[corporate-em]
url = https://em.example.com
api_key_env = EM_API_KEY
site = Head Office

# Other optional keys per section:
#   mode = auto | em | icp      (default auto)
#   tls_verify = 0              (lab use only; prefer ca_bundle for a private CA)
#   ca_bundle = corp-ca.pem     (relative paths resolve against this file's folder)
